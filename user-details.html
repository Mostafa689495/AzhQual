        /* Simplified Navigation */
        .main-nav {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 60px;
            background: var(--white);
            box-shadow: var(--shadow);
            display: flex;
            align-items: center;
            justify-content: space-between;

        }

            gap: 1rem;
        }

            border-radius: 8px;
            text-decoration: none;
            color: var(--gray);
            font-weight: 500;
            transition: all 0.3s ease;

        .nav-item:hover {
            background: var(--light);
            color: var(--primary);
        }

        .nav-item.active {

            color: var(--white);
        }

            font-size: 1.2rem !important;
        }

        .page-content {
            padding: 2rem;
            max-width: 1400px;
            margin: 0 auto;
        }

            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));

        .info-card:hover {

        .info-card-icon {

            height: 50px !important;

            align-items: center;

            width: 100%;
            max-width: 400px;
            margin-bottom: 1.5rem;
            transition: all 0.3s ease;

        .search-container input {

            border: 2px solid #e2e8f0;
            border-radius: 12px;

            font-size: 1.1rem;

        .search-container:hover i {

        .search-clear {
            position: absolute;

            top: 50%;

            border: none;
            color: #94a3b8;

            background: #f1f5f9;

            background: #e2e8f0;
        }

        .subsections-filter::-webkit-scrollbar {

            display: grid;

            grid-template-columns: repeat(2, 1fr);

            flex-direction: column;
            align-items: center;
            justify-content: center;

            background: linear-gradient(135deg, #3b82f6, #2563eb) !important;

            background: linear-gradient(135deg, #f59e0b, #d97706) !important;
            grid-column: 1 / -1;
        }

        .info-card.stats-info .info-item:nth-child(3) {
            background: linear-gradient(135deg, #22c55e, #16a34a) !important;
        }

        .info-card.stats-info .info-item:nth-child(4) {
            background: linear-gradient(135deg, #ef4444, #dc2626) !important;
        }

        .info-card.stats-info .info-label {
            color: rgba(255, 255, 255, 0.9) !important;
            font-size: 0.9rem !important;
            margin-bottom: 0.5rem !important;
        }

        .info-card.stats-info .info-value {
            color: #ffffff !important;
            font-size: 1.8rem !important;
            font-weight: 600 !important;
        }

        .info-card .info-list {
            display: grid;
            gap: 1rem;
        }

        .info-card .info-item {
            display: flex;
            flex-direction: column;
            padding: 1.2rem !important;
            border-radius: 12px !important;
            transition: all 0.3s ease;
        }

        /* تنسيق البيانات الشخصية */
        .info-card.personal-info .info-item:nth-child(1) {
            background: linear-gradient(135deg, #6366f1, #4f46e5) !important;
        }

        .info-card.personal-info .info-item:nth-child(2) {
            background: linear-gradient(135deg, #ec4899, #db2777) !important;
        }

        .info-card.personal-info .info-item:nth-child(3) {
            background: linear-gradient(135deg, #8b5cf6, #7c3aed) !important;

        /* تنسيق معلومات المعهد */
        .info-card.institute-info .info-item:nth-child(1) {
            background: linear-gradient(135deg, #06b6d4, #0891b2) !important;
        }

        .info-card.institute-info .info-item:nth-child(2) {
            background: linear-gradient(135deg, #10b981, #059669) !important;
        }

        .info-card.institute-info .info-item:nth-child(3) {
            background: linear-gradient(135deg, #f59e0b, #d97706) !important;
        }

        .info-card .info-label {
            color: rgba(255, 255, 255, 0.9) !important;
            font-size: 0.9rem !important;
            margin-bottom: 0.5rem !important;
        }

        .info-card .info-value {
            color: #ffffff !important;
            font-size: 1.2rem !important;
            font-weight: 500 !important;
        }

        /* تحسين أيقونات العناوين */
        .info-card-header {
            margin-bottom: 1.5rem !important;
            padding: 1rem !important;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 12px;
        }

        .info-card-icon {
            width: 50px !important;
            height: 50px !important;
            border-radius: 15px !important;
            font-size: 1.5rem !important;
            background: rgba(255, 255, 255, 0.2) !important;
            color: #ffffff !important;
        }

        .info-card-title {
            color: var(--dark) !important;
            font-size: 1.3rem !important;
            font-weight: 600 !important;
        }

            height: 20px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 0.8s linear infinite;

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .loading-spinner {
            width: 50px;
            height: 50px;
            border: 4px solid var(--light);
            border-top-color: var(--primary);
            border-radius: 50%;

        .documents-grid {

            gap: 1rem;
        }

            display: flex;
            gap: 1.5rem;

            margin-bottom: 1.5rem;

            font-weight: 500;

        }

        .view-btn {
            background: linear-gradient(135deg, #3b82f6, #2563eb);

            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }

        .back-btn {
            background: linear-gradient(135deg, #6b7280, #4b5563);

            border: none;
            border-radius: 10px;

        .back-btn:hover {

            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
        }

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getDatabase, ref, get } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyB_e0oD-74pSllN0yivBYiX-4oYbO_1PJ4",
            authDomain: "learning-8f044.firebaseapp.com",
            databaseURL: "https://learning-8f044-default-rtdb.firebaseio.com",
            projectId: "learning-8f044",
            storageBucket: "learning-8f044.firebasestorage.app",
            messagingSenderId: "453828841732",
            appId: "1:453828841732:web:99226149b359d41df64051",
            measurementId: "G-SCSBHBQM08"
        }

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getDatabase(app);

        // دالة التنقل بين الصفحات
        window.navigateTo = function(page) {
            window.location.href = page;
        }

        // دالة الحصول على عدد المستندات
        async function getDocumentsCount(uid) {
            const imagesRef = ref(db, `users/${uid}/images`);
            return get(imagesRef)
                .then(snapshot => {
                    const images = snapshot.val() || {};
                    let total = 0;
                    let pending = 0;
                    let approved = 0;
                    let rejected = 0;

                    Object.values(images).forEach(section => {
                        Object.values(section).forEach(doc => {
                            total++;
                            if (doc.status === 'pending') pending++;
                            if (doc.status === 'approved') approved++;
                            if (doc.status === 'rejected') rejected++;
                        });
                    });

                    return { total, pending, approved, rejected };
                })
                .catch(error => {
                    console.error('Error getting documents count:', error);
                    showToast('حدث خطأ في تحميل إحصائيات المستندات', true);
                    return { total: 0, pending: 0, approved: 0, rejected: 0 };
                });
        }

        // دالة تحميل تفاصيل المستخدم

                                    <div class="info-list">

                                        <div class="info-item">

                                            <span class="info-value">${user.phone}</span>

                                        <div class="info-item">
                                            <span class="info-label">تاريخ التسجيل</span>
                                            <span class="info-value">${new Date(user.createdAt || Date.now()).toLocaleDateString('ar-EG')}</span>

                                    </div>
                                </div>

                                <div class="info-card institute-info">
                                    <div class="info-card-header">
                                        <div class="info-card-icon">
                                            <i class="fas fa-school"></i>

                                        <h3 class="info-card-title">معلومات المعهد</h3>
                                    </div>
                                    <div class="info-list">
                                        <div class="info-item">
                                            <span class="info-label">المحافظة</span>
                                            <span class="info-value">${user.governorate}</span>
                                        </div>
                                        <div class="info-item">
                                            <span class="info-label">الإدارة</span>
                                            <span class="info-value">${user.administration}</span>
                                        </div>
                                        <div class="info-item">
                                            <span class="info-label">المعهد</span>
                                            <span class="info-value">${user.institute}</span>
                                        </div>
                                    </div>
                                </div>

                                <div class="info-card stats-info">
                                    <div class="info-card-header">
                                        <div class="info-card-icon">
                                            <i class="fas fa-chart-pie"></i>
                                        </div>
                                        <h3 class="info-card-title">إحصائيات المستندات</h3>
                                    </div>
                                    <div class="info-list">
                                        <div class="info-item">
                                            <span class="info-label">إجمالي المستندات</span>
                                            <span class="info-value">${documentsCount.total}</span>
                                        </div>
                                        <div class="info-item">
                                            <span class="info-label">قيد المراجعة</span>
                                            <span class="info-value">${documentsCount.pending}</span>
                                        </div>
                                        <div class="info-item">
                                            <span class="info-label">تمت الموافقة</span>
                                            <span class="info-value">${documentsCount.approved}</span>
                                        </div>
                                        <div class="info-item">
                                            <span class="info-label">مرفوضة</span>
                                            <span class="info-value">${documentsCount.rejected}</span>

                                    </a>
                                </div>

                                    <input type="text" id="documentSearch" placeholder="البحث في المستندات..." oninput="searchDocuments()">

                        <button class="back-btn" onclick="navigateTo('users.html')" style="margin-top: 1rem;">

        // تحميل مستندات المستخدم
        async function loadUserDocuments(uid, container) {
            const imagesRef = ref(db, `users/${uid}/images`);
            const snapshot = await get(imagesRef);
            const images = snapshot.val() || {};

            let tabsHtml = '<div class="documents-tabs">';
            let contentHtml = '';
            let isFirst = true;

            for (const [section, docs] of Object.entries(images)) {
                const sectionTitle = getSectionTitle(section);
                const activeClass = isFirst ? 'active' : '';
                
                // جمع الأقسام الفرعية الفريدة
                const subsections = new Set();
                const subsubsections = new Set();
                Object.values(docs).forEach(doc => {
                    if (doc.subsection) {
                        subsections.add(doc.subsection);
                    }
                    if (doc.subSubsection) {
                        subsubsections.add(doc.subSubsection);
                    }
                });
                
                tabsHtml += `
                    <button class="tab-button ${activeClass}" onclick="switchTab('${section}')">
                        ${sectionTitle}
                    </button>
                `;

                contentHtml += `
                    <div id="tab-${section}" class="tab-content ${activeClass}" data-section="${section}">
                        ${subsections.size > 0 ? `
                            <div class="subsections-filter ${isFirst ? 'active' : ''}" id="subsections-${section}">
                                <button class="subsection-btn active" onclick="filterSubsections('${section}', '')">
                                    الكل
                                </button>
                                ${Array.from(subsections).map(sub => `
                                    <button class="subsection-btn" onclick="filterSubsections('${section}', '${sub}')">
                                        ${sub}
                                    </button>
                                `).join('')}
                            </div>
                        ` : ''}
                        
                        <div class="documents-grid">
                            ${Object.entries(docs).map(([docId, doc]) => `
                                <div class="document-card" data-id="${docId}" data-subsection="${doc.subsection || ''}" data-subsubsection="${doc.subSubsection || ''}">
                                    <div class="document-thumbnail">
                                        <img src="${doc[0]}" alt="${doc.title || 'مستند'}">
                                    </div>
                                    <div class="document-details">
                                        <h3 class="document-title">${doc.title || 'مستند بدون عنوان'}</h3>
                                        <div class="document-info">
                                            <div class="info-item">
                                                <span class="info-label">تاريخ الرفع</span>
                                                <span class="info-value">${new Date(doc.uploadedAt).toLocaleDateString('ar-EG')}</span>
                                            </div>
                                            ${doc.subsection ? `
                                                <div class="info-item">
                                                    <span class="info-label">القسم الفرعي</span>
                                                    <span class="info-value">${doc.subsection}</span>
                                                </div>
                                            ` : ''}
                                            ${doc.subSubsection ? `
                                                <div class="info-item">
                                                    <span class="info-label">القسم الفرعي الثاني</span>
                                                    <span class="info-value">${doc.subSubsection}</span>
                                                </div>
                                            ` : ''}
                                            <div class="info-item">
                                                <span class="info-label">الحالة</span>
                                                <span class="status-badge status-${doc.status || 'pending'}">
                                                    <i class="fas fa-${getStatusIcon(doc.status)}"></i>
                                                    ${getStatusText(doc.status)}
                                                </span>
                                            </div>
                                        </div>
                                        <div class="document-actions">
                                            <button class="action-btn view-btn" onclick="viewImages('${uid}', '${section}', '${docId}')">
                                                <i class="fas fa-images"></i>
                                                عرض الصور
                                            </button>
                                        </div>
                                    </div>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                `;

                isFirst = false;
            }

            tabsHtml += '</div>';
            container.innerHTML = Object.keys(images).length ? tabsHtml + contentHtml : '<p>لا توجد مستندات</p>';
            
            // تأكد من أن فلتر القسم الفرعي للتاب الأول ظاهر
            if (Object.keys(images).length > 0) {
                const firstSection = Object.keys(images)[0];
                const subsectionsFilter = document.getElementById(`subsections-${firstSection}`);
                if (subsectionsFilter) {
                    subsectionsFilter.classList.add('active');
                }
            }
        }

        // دالة تبديل التبويبات
        window.switchTab = function(sectionId) {
            document.querySelectorAll('.tab-button').forEach(btn => {
                btn.classList.remove('active');
            });
            document.querySelectorAll('.tab-content').forEach(content => {
                content.classList.remove('active');
            });

            document.querySelector(`.tab-button[onclick*="${sectionId}"]`).classList.add('active');
            const tabContent = document.getElementById(`tab-${sectionId}`);
            tabContent.classList.add('active');

            // إظهار فلتر الأقسام الفرعية إذا وجد
            const subsectionsFilter = document.getElementById(`subsections-${sectionId}`);
            if (subsectionsFilter) {
                subsectionsFilter.classList.add('active');
                
                // تفعيل زرار "الكل" تلقائياً
                const allButton = subsectionsFilter.querySelector('.subsection-btn');
                if (allButton) {
                    // إزالة التفعيل من جميع الأزرار أولاً
                    subsectionsFilter.querySelectorAll('.subsection-btn').forEach(btn => {
                        btn.classList.remove('active');
                    });
                    // تفعيل زرار "الكل"
                    allButton.classList.add('active');
                    // تطبيق الفلتر "الكل" تلقائياً
                    filterSubsections(sectionId, '');
                }
            }
        };

        // دالة تصفية الأقسام الفرعية
        window.filterSubsections = function(section, subsection) {
            const tabContent = document.getElementById(`tab-${section}`);
            const cards = tabContent.querySelectorAll('.document-card');
            const buttons = tabContent.querySelectorAll('.subsection-btn');
            
            // تحديث حالة أزرار القسم الفرعي الأول
            buttons.forEach(btn => {
                if (
                    (subsection === '' && btn.textContent.trim() === 'الكل') ||
                    btn.textContent.trim() === subsection
                ) {
                    btn.classList.add('active');
                } else {
                    btn.classList.remove('active');
                }
            });
            
            // تصفية البطاقات بناءً على القسم الفرعي الأول
            cards.forEach(card => {
                if (!subsection || card.dataset.subsection === subsection) {
                    card.style.display = 'flex';
                } else {
                    card.style.display = 'none';
                }
            });
        };

        // دالة عرض الصور
        window.viewImages = function(uid, section, docId) {
            // حفظ معلومات المستند في التخزين المحلي
            localStorage.setItem('selectedDocument', JSON.stringify({ uid, section, docId }));
            // الانتقال إلى صفحة المستندات
            window.location.href = 'documents.html';
        };

        // دالة عرض التعليقات
        window.showComments = function(uid, section, docId) {
            // حفظ معلومات المستند في التخزن المحلي
            localStorage.setItem('selectedDocument', JSON.stringify({ uid, section, docId }));
            // الانتقال إلى صفحة المستندات
            window.location.href = 'documents.html';
        };

        // دالة تحديث الحالة
        window.updateStatus = async function(uid, section, docId, newStatus) {
            try {
                const docRef = ref(db, `users/${uid}/images/${section}/${docId}`);
                await update(docRef, { status: newStatus });
                
                showToast(newStatus === 'approved' 
                    ? 'تم الموافقة على المستند بنجاح' 
                    : 'تم رفض المستند بنجاح'
                );
                
                // إعادة تحميل تفاصيل المستخدم
                loadUserDetails();
            } catch (error) {
                console.error('Error updating status:', error);
                showToast('حدث خطأ أثناء تحديث حالة المستند', true);
            }
        };

        // دالة عرض ملف المستخدم
        window.viewUserProfile = function(userId) {
            localStorage.setItem('selectedUserId', userId);
            window.location.href = 'user-details.html';
        };

        // Helper Functions
        function getSectionTitle(section) {
            const titles = {
                'hierarchy': 'الوثائق',
                'leadership-meetings': 'اجتماعات القيادة',
                'supervisor-meetings': 'اجتماعات المشرفين',
                'family-meetings': 'اجتماعات الأسر',
                'social-specialist': 'الأخصائي الاجتماعي',
                'librarian': 'أمين المكتبة',
                'sports': 'سجل التربية الرياضية',
                'general-photos': 'صور عامة ولوحات المعهد',
                'results': 'النتيجة',
                'attendance': 'الغياب',
                'domains': 'المجالات',
                'notes': 'الملاحظات',
                'training': 'وحدة التدريب',
                'committees': 'اللجان',
                'health-visitor': 'توثيق أنشطة الزائرة الصحية',
                'broadcast': 'الإذاعة',
                'curriculum-maps': 'خرائط المنهج',
                'teacher-record': 'سجل المعلم',
                'special-needs': 'سجل ذوي الاحتياجات الخاصة',
                'science-lab': 'معمل العلوم',
                'maintenance': 'سجل المتابعة والصيانة',
                'student-affairs': 'شؤون الطلبة',
                'institution-context': 'سياق المؤسسة',
                'staff-affairs': 'شؤون العاملين',
                'remedial-programs': 'البرامج العلاجية',
                'library': 'أمين المكتبة',
                'complaints': 'لجنة الشكاوي والمقترحات',
                'computer-lab': 'معمل الحاسب',
                'reward-committee': 'لجنة الأثابة والتقويم',
                'preparation-books':' دفاتر التحضير',
                'hope-peace-committee': 'لجنة الأمل والسلام'
            };
            return titles[section] || section;
        }

        function getStatusIcon(status) {
            const icons = {
                'pending': 'clock',
                'approved': 'check-circle',
                'rejected': 'times-circle'
            };
            return icons[status] || 'clock';
        }

        function getStatusText(status) {
            const statusTexts = {
                'pending': 'قيد المراجعة',
                'approved': 'تمت الموافقة',
                'rejected': 'مرفوض'
            };
            return statusTexts[status] || 'قيد المراجعة';
        }

        function showToast(message, isError = false) {
            Toastify({
                text: message,
                duration: 3000,
                gravity: "top",
                position: "center",
                className: isError ? "toast-error" : "toast-success",
                stopOnFocus: true
            }).showToast();
        }

        // دالة البحث في المستندات
        window.searchDocuments = function() {
            const searchInput = document.getElementById('documentSearch');
            if (!searchInput) return;
            
            const searchTerm = searchInput.value.toLowerCase();
            const documentCards = document.querySelectorAll('.document-card');
            
            documentCards.forEach(card => {
                const title = card.querySelector('.document-title').textContent.toLowerCase();
                const subsection = card.querySelector('.info-value')?.textContent.toLowerCase() || '';
                
                if (title.includes(searchTerm) || subsection.includes(searchTerm)) {
                    card.style.display = 'flex';
                    card.style.opacity = '0';
                    card.style.transform = 'translateY(10px)';
                    card.style.transition = 'all 0.3s ease';
                    
                    // Trigger reflow to enable transition
                    void card.offsetWidth;
                    
                    card.style.opacity = '1';
                    card.style.transform = 'translateY(0)';
                } else {
                    card.style.display = 'none';
                }
            });
        };

        // دالة حذف البحث
        window.clearSearch = function() {
            document.getElementById('documentSearch').value = '';
            document.getElementById('searchClear').classList.remove('show');
            searchDocuments();
        }

        // تحميل تفاصيل المستخدم عند تحميل الصفحة
        document.addEventListener('DOMContentLoaded', () => {
            loadUserDetails();
            
            // تأكد من وجود عنصر البحث قبل إضافة المستمع
            const searchInput = document.getElementById('documentSearch');
            if (searchInput) {
                searchInput.addEventListener('input', function() {
                    if (this.value) {
                        document.getElementById('searchClear').classList.add('show');
                    } else {
                        document.getElementById('searchClear').classList.remove('show');
                    }
                });
            }
        });
    </script>
</body>
</html>
