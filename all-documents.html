<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>جميع المستندات - نظام مراجعة الوثائق</title>
    <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css">
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/toastify-js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Cairo', sans-serif;
        }

        :root {
            --primary: #3b82f6;
            --primary-dark: #2563eb;
            --secondary: #f43f5e;
            --success: #22c55e;
            --warning: #f59e0b;
            --danger: #ef4444;
            --dark: #0f172a;
            --light: #f8fafc;
            --gray: #64748b;
            --white: #ffffff;
            --shadow: 0 4px 6px -1px rgba(0,0,0,0.1);
            --shadow-lg: 0 10px 25px -3px rgba(0,0,0,0.1);
        }

        body {
            background: var(--light);
            min-height: 100vh;
            padding-top: 60px;
        }

        .header {
            background: var(--white);
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 60px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 1.5rem;
            box-shadow: var(--shadow);
            z-index: 100;
            border-bottom: 1px solid #e2e8f0;
        }

        .header h1 {
            font-size: 1.2rem;
            color: var(--dark);
            margin: 0;
        }

        /* New simplified navigation */
        .main-nav {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 60px;
            background: var(--white);
            box-shadow: var(--shadow);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 1.5rem;
            z-index: 1000;
        }

        .nav-logo {
            font-size: 1.2rem;
            font-weight: 700;
            color: var(--primary);
        }

        .nav-menu {
            display: flex;
            gap: 1rem;
        }

        .nav-item {
            padding: 0.5rem 1rem;
            border-radius: 8px;
            text-decoration: none;
            color: var(--gray);
            font-weight: 500;
            transition: all 0.3s ease;
        }

        .nav-item:hover {
            background: var(--light);
            color: var(--primary);
        }

        .nav-item.active {
            background: var(--primary);
            color: var(--white);
        }

        .view-toggle {
            display: none;
        }

        .main-container {
            padding: 1rem;
            max-width: 1400px;
            margin: 0 auto;
        }

        .page-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
            flex-wrap: wrap;
            gap: 1rem;
        }

        .page-title {
            color: var(--dark);
            font-size: 1.5rem;
            margin: 0;
        }

        .stats-section {
            margin-bottom: 2rem;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 1.5rem;
        }

        .stat-card {
            background: var(--white);
            border-radius: 16px;
            padding: 1.5rem;
            box-shadow: var(--shadow);
            border: 1px solid #e2e8f0;
            display: flex;
            align-items: center;
            gap: 1rem;
            transition: all 0.3s ease;
        }

        .stat-card:hover {
            transform: translateY(-5px);
            box-shadow: var(--shadow-lg);
        }

        .stat-icon {
            width: 60px;
            height: 60px;
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            color: var(--white);
        }

        .bg-primary {
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
        }

        .bg-warning {
            background: linear-gradient(135deg, var(--warning), #d97706);
        }

        .bg-success {
            background: linear-gradient(135deg, var(--success), #16a34a);
        }

        .bg-danger {
            background: linear-gradient(135deg, var(--danger), #dc2626);
        }

        .stat-info {
            flex: 1;
        }

        .stat-value {
            font-size: 2rem;
            font-weight: 700;
            color: var(--dark);
            margin: 0 0 0.25rem 0;
        }

        .stat-label {
            color: var(--gray);
            margin: 0;
            font-size: 0.95rem;
        }

        .filters-section {
            background: var(--white);
            padding: 1.5rem;
            border-radius: 16px;
            margin-bottom: 2rem;
            box-shadow: var(--shadow);
            border: 1px solid #e2e8f0;
        }

        .filters-row {
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
            align-items: end;
        }

        .filter-group {
            min-width: 200px;
            position: relative;
        }

        .filter-group label {
            display: block;
            margin-bottom: 0.5rem;
            color: var(--gray);
            font-size: 0.9rem;
        }

        .filter-group select,
        .filter-group input {
            width: 100%;
            padding: 0.8rem;
            border: 2px solid var(--light);
            border-radius: 8px;
            font-size: 0.95rem;
            background: var(--light);
            color: var(--dark);
            transition: all 0.3s ease;
        }

        .filter-group select:focus,
        .filter-group input:focus {
            border-color: var(--primary);
            background: var(--white);
            outline: none;
        }

        .search-box {
            flex: 1;
            min-width: 200px;
            position: relative;
            max-width: 400px;
        }

        .search-box input {
            padding: 1rem 1rem 1rem 3rem;
            border: 2px solid var(--light);
            border-radius: 12px;
            font-size: 1rem;
            background: var(--light);
            color: var(--dark);
            transition: all 0.3s ease;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.05);
        }

        .search-box input:focus {
            border-color: var(--primary);
            background: var(--white);
            outline: none;
            box-shadow: 0 4px 10px rgba(59, 130, 246, 0.2);
        }

        .search-box i {
            position: absolute;
            right: 1.2rem;
            top: 50%;
            transform: translateY(-50%);
            color: var(--gray);
            font-size: 1.1rem;
            transition: all 0.3s ease;
        }

        .search-box:hover i {
            color: var(--primary);
        }

        .search-clear {
            position: absolute;
            left: 1rem;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: var(--gray);
            cursor: pointer;
            font-size: 1.1rem;
            width: 24px;
            height: 24px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
            opacity: 0;
        }

        .search-clear.show {
            opacity: 1;
        }

        .search-clear:hover {
            color: var(--danger);
            background: #f1f5f9;
        }

        .filter-actions {
            display: flex;
            gap: 0.5rem;
        }

        .btn {
            padding: 0.8rem 1.2rem;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            font-size: 0.95rem;
            font-weight: 500;
            transition: all 0.3s ease;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: var(--white);
        }

        .btn-outline {
            background: transparent;
            border: 2px solid var(--primary);
            color: var(--primary);
        }

        .documents-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 1.5rem;
            margin-bottom: 2rem;
        }

        .document-card {
            background: var(--white);
            border-radius: 16px;
            overflow: hidden;
            box-shadow: var(--shadow);
            transition: all 0.3s ease;
            cursor: pointer;
            border: 1px solid #e2e8f0;
        }

        .document-card:hover {
            transform: translateY(-5px);
            box-shadow: var(--shadow-lg);
        }

        .document-thumbnail {
            height: 180px;
            overflow: hidden;
            position: relative;
            border-bottom: 1px solid #e2e8f0;
        }

        .document-thumbnail img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.3s ease;
        }

        .document-card:hover .document-thumbnail img {
            transform: scale(1.05);
        }

        .document-status {
            position: absolute;
            top: 1rem;
            left: 1rem;
            padding: 0.3rem 0.8rem;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 600;
            color: var(--white);
        }

        .status-pending {
            background: var(--warning);
        }

        .status-approved {
            background: var(--success);
        }

        .status-rejected {
            background: var(--danger);
        }

        .document-info {
            padding: 1.2rem;
        }

        .document-title {
            font-size: 1.1rem;
            color: var(--dark);
            margin-bottom: 0.5rem;
            font-weight: 600;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .document-meta {
            display: flex;
            justify-content: space-between;
            color: var(--gray);
            font-size: 0.85rem;
            margin-bottom: 0.8rem;
        }

        .document-user {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            color: var(--gray);
            font-size: 0.9rem;
            margin-top: 0.8rem;
        }

        .user-avatar {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            background: var(--primary);
            color: var(--white);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.7rem;
            font-weight: 600;
        }

        .user-link {
            color: var(--primary);
            text-decoration: none;
            font-weight: 500;
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .user-link:hover {
            color: var(--primary-dark);
            text-decoration: underline;
        }

        .loading-container {
            text-align: center;
            padding: 3rem;
        }

        .loading-spinner {
            width: 50px;
            height: 50px;
            border: 4px solid var(--light);
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 1.5rem;
        }

        .loading-text {
            color: var(--gray);
            font-size: 1.1rem;
        }

        .no-documents {
            text-align: center;
            padding: 3rem;
            background: var(--white);
            border-radius: 12px;
            box-shadow: var(--shadow);
        }

        .no-documents i {
            font-size: 3rem;
            color: var(--light);
            margin-bottom: 1rem;
        }

        .no-documents h3 {
            color: var(--dark);
            margin-bottom: 0.5rem;
        }

        .no-documents p {
            color: var(--gray);
        }

        .pagination {
            display: flex;
            justify-content: center;
            gap: 0.5rem;
            margin-top: 2rem;
        }

        .pagination button {
            padding: 0.5rem 1rem;
            border: none;
            border-radius: 6px;
            background: var(--white);
            color: var(--gray);
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: var(--shadow);
        }

        .pagination button:hover:not(:disabled) {
            background: var(--primary);
            color: var(--white);
        }

        .pagination button.active {
            background: var(--primary);
            color: var(--white);
        }

        .pagination button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        @media (max-width: 768px) {
            .filters-row {
                flex-direction: column;
            }
            
            .filter-group {
                width: 100%;
            }
            
            .documents-grid {
                grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            }
        }
    </style>
</head>

    <div class="main-container">

        <div class="stats-section">

                </div>
                <div class="stat-card">
                    <div class="stat-icon bg-warning">
                        <i class="fas fa-clock"></i>

        <div class="filters-section">
            <div class="filters-row">
                <div class="search-box">
                    <input type="text" id="searchInput" placeholder="البحث عن مستندات..." oninput="filterDocuments()">

                <div class="filter-group">

                        <option value="domains">المجالات</option>

                        <option value="training">وحدة التدريب</option>
                        <option value="committees">اللجان</option>
                        <option value="health-visitor">توثيق أنشطة الزائرة الصحية</option>
                        <option value="broadcast">الإذاعة</option>
                        <option value="curriculum-maps">خرائط المنهج</option>
                        <option value="teacher-record">سجل المعلم</option>
                        <option value="special-needs">سجل ذوي الاحتياجات الخاصة</option>
                        <option value="science-lab">معمل العلوم</option>
                        <option value="maintenance">سجل المتابعة والصيانة</option>
                        <option value="student-affairs">شؤون الطلبة</option>
                        <option value="institution-context">سياق المؤسسة</option>
                        <option value="staff-affairs">شؤون العاملين</option>
                        <option value="remedial-programs">البرامج العلاجية</option>
                        <option value="library">أمين المكتبة</option>
                        <option value="complaints">لجنة الشكاوي والمقترحات</option>
                        <option value="computer-lab">معمل الحاسب</option>
                        <option value="reward-committee">لجنة الأثابة والتقويم</option>
                        <option value="preparation-books">دفاتر التحضير</option>
                        <option value="hope-peace-committee">لجنة الأمل والسلام</option>

        <div id="documentsContainer">

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, get } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyB_e0oD-74pSllN0yivBYiX-4oYbO_1PJ4",
            authDomain: "learning-8f044.firebaseapp.com",
            databaseURL: "https://learning-8f044-default-rtdb.firebaseio.com",
            projectId: "learning-8f044",
            storageBucket: "learning-8f044.firebasestorage.app",
            messagingSenderId: "453828841732",
            appId: "1:453828841732:web:99226149b359d41df64051",
            measurementId: "G-SCSBHBQM08"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        // متغيرات للتحكم في التحميل التدريجي
        let allDocuments = [];
        let filteredDocuments = [];
        let displayedDocuments = [];
        let documentsPerLoad = 20;
        let loadedCount = 0;
        let isLoading = false;

        // دالة التنقل بين الصفحات
        window.navigateTo = function(page) {
            window.location.href = page;
        };

        // دالة إعادة تعيين الفلاتر
        window.resetFilters = function() {
            document.getElementById('searchInput').value = '';
            document.getElementById('statusFilter').value = '';
            document.getElementById('sectionFilter').value = '';
            hideSearchClearButton();
            filterDocuments();
        };

        // دالة مسح البحث
        window.clearSearch = function() {
            document.getElementById('searchInput').value = '';
            hideSearchClearButton();
            filterDocuments();
        };

        // دالة إظهار زر مسح البحث
        function showSearchClearButton() {
            const clearBtn = document.getElementById('searchClear');
            clearBtn.classList.add('show');
        }

        // دالة إخفاء زر مسح البحث
        function hideSearchClearButton() {
            const clearBtn = document.getElementById('searchClear');
            clearBtn.classList.remove('show');
        }

        // دالة فلترة المستندات
        window.filterDocuments = function() {
            const searchTerm = document.getElementById('searchInput').value.toLowerCase();
            const statusFilter = document.getElementById('statusFilter').value;
            const sectionFilter = document.getElementById('sectionFilter').value;

            // إظهار زر مسح البحث إذا كان هناك نص بحث
            if (searchTerm) {
                showSearchClearButton();
            } else {
                hideSearchClearButton();
            }

            filteredDocuments = allDocuments.filter(doc => {
                const matchesSearch = !searchTerm || 
                    doc.title.toLowerCase().includes(searchTerm) || 
                    doc.userName.toLowerCase().includes(searchTerm) ||
                    doc.userInstitute.toLowerCase().includes(searchTerm);
                
                const matchesStatus = !statusFilter || doc.status === statusFilter;
                const matchesSection = !sectionFilter || doc.section === sectionFilter;

                return matchesSearch && matchesStatus && matchesSection;
            });

            // إعادة تعيين المتغيرات عند تغيير الفلاتر
            loadedCount = 0;
            displayedDocuments = [];
            document.getElementById('documentsContainer').innerHTML = '<div class="loading-container"><div class="loading-spinner"></div><p class="loading-text">جاري تحميل المستندات...</p></div>';
            loadMoreDocuments();
        };

        // دالة تحميل المزيد من المستندات
        function loadMoreDocuments() {
            if (isLoading) return;
            
            isLoading = true;
            
            // التحقق مما إذا تم تحميل جميع المستندات
            if (loadedCount >= filteredDocuments.length) {
                isLoading = false;
                return;
            }
            
            // تحديد المستندات التي سيتم تحميلها
            const startIndex = loadedCount;
            const endIndex = Math.min(startIndex + documentsPerLoad, filteredDocuments.length);
            const newDocuments = filteredDocuments.slice(startIndex, endIndex);
            
            // تحديث عدد المستندات المحملة
            loadedCount = endIndex;
            
            // إضافة المستندات الجديدة إلى المصفوفة المعروضة
            displayedDocuments = displayedDocuments.concat(newDocuments);
            
            // عرض المستندات
            renderDocuments();
            
            isLoading = false;
        }

        // دالة عرض المستندات
        function renderDocuments() {
            const container = document.getElementById('documentsContainer');
            
            if (displayedDocuments.length === 0) {
                if (filteredDocuments.length === 0) {
                    container.innerHTML = `
                        <div class="no-documents">
                            <i class="fas fa-file-alt"></i>
                            <h3>لا توجد مستندات</h3>
                            <p>لم يتم العثور على مستندات تطابق الفلاتر المحددة</p>
                        </div>
                    `;
                } else {
                    container.innerHTML = '<div class="loading-container"><div class="loading-spinner"></div><p class="loading-text">جاري تحميل المستندات...</p></div>';
                }
                return;
            }

            let documentsHTML = '<div class="documents-grid">';
            
            displayedDocuments.forEach(doc => {
                const date = new Date(doc.uploadedAt);
                const formattedDate = date.toLocaleDateString('ar-EG');
                const statusClass = doc.status === 'approved' ? 'approved' : doc.status === 'rejected' ? 'rejected' : 'pending';
                const statusText = doc.status === 'approved' ? 'تمت الموافقة' : doc.status === 'rejected' ? 'مرفوض' : 'قيد المراجعة';
                
                documentsHTML += `
                    <div class="document-card" onclick="openDocument('${doc.userId}', '${doc.section}', '${doc.id}')">
                        <div class="document-thumbnail">
                            <img src="${doc.thumbnail || ''}" alt="صورة المستند" onerror="this.src='https://placehold.co/300x180?text=لا+توجد+صورة'">
                            <span class="document-status status-${statusClass}">${statusText}</span>
                        </div>
                        <div class="document-info">
                            <h3 class="document-title">${doc.title}</h3>
                            <div class="document-meta">
                                <span><i class="fas fa-calendar"></i> ${formattedDate}</span>
                                <span><i class="fas fa-images"></i> ${doc.imageCount} صورة</span>
                            </div>
                            <div class="document-user" onclick="openUserProfile('${doc.userId}'); event.stopPropagation();">
                                <div class="user-avatar">${doc.userName.charAt(0)}</div>
                                <span class="user-link">${doc.userName}</span>
                            </div>
                            <div class="document-user">
                                <i class="fas fa-school"></i>
                                <span>${doc.userInstitute}</span>
                            </div>
                        </div>
                    </div>
                `;
            });
            
            documentsHTML += '</div>';
            
            // إضافة مؤشر التحميل إذا لم يتم تحميل جميع المستندات
            if (loadedCount < filteredDocuments.length) {
                documentsHTML += `
                    <div id="loadingIndicator" class="loading-container">
                        <div class="loading-spinner"></div>
                        <p class="loading-text">جاري تحميل المزيد من المستندات...</p>
                    </div>
                `;
            }
            
            container.innerHTML = documentsHTML;
        }

        // دالة عرض الترقيم
        function displayPagination() {
            const totalPages = Math.ceil(filteredDocuments.length / documentsPerPage);
            const paginationContainer = document.getElementById('paginationContainer');
            
            if (totalPages <= 1) {
                paginationContainer.innerHTML = '';
                return;
            }

            let paginationHTML = '';
            
            // زر السابق
            paginationHTML += `
                <button onclick="changePage(${currentPage - 1})" ${currentPage === 1 ? 'disabled' : ''}>
                    <i class="fas fa-chevron-right"></i>
                </button>
            `;
            
            // أزرار الأرقام
            const startPage = Math.max(1, currentPage - 2);
            const endPage = Math.min(totalPages, currentPage + 2);
            
            for (let i = startPage; i <= endPage; i++) {
                paginationHTML += `
                    <button onclick="changePage(${i})" ${i === currentPage ? 'class="active"' : ''}>
                        ${i}
                    </button>
                `;
            }
            
            // زر التالي
            paginationHTML += `
                <button onclick="changePage(${currentPage + 1})" ${currentPage === totalPages ? 'disabled' : ''}>
                    <i class="fas fa-chevron-left"></i>
                </button>
            `;
            
            paginationContainer.innerHTML = paginationHTML;
        }

        // دالة التحقق من الحاجة إلى تحميل المزيد
        function checkScroll() {
            const container = document.getElementById('documentsContainer');
            const loadingIndicator = document.getElementById('loadingIndicator');
            
            if (!loadingIndicator) return;
            
            const rect = loadingIndicator.getBoundingClientRect();
            const isVisible = rect.top <= window.innerHeight && rect.bottom >= 0;
            
            if (isVisible && !isLoading) {
                loadMoreDocuments();
            }
        }

        // دالة فتح المستند
        window.openDocument = function(userId, section, docId) {
            const documentInfo = {
                uid: userId,
                section: section,
                docId: docId
            };
            
            localStorage.setItem('selectedDocument', JSON.stringify(documentInfo));
            window.location.href = 'documents.html';
        };

        // دالة فتح ملف المستخدم
        window.openUserProfile = function(userId) {
            localStorage.setItem('selectedUserId', userId);
            window.location.href = 'user-details.html';
        };

        // دالة جلب جميع المستندات
        async function loadAllDocuments() {
            try {
                const usersRef = ref(db, 'users');
                const usersSnapshot = await get(usersRef);
                const users = usersSnapshot.val() || {};

                allDocuments = [];
                
                // متغيرات للإحصائيات
                let totalDocs = 0;
                let pendingDocs = 0;
                let approvedDocs = 0;
                let rejectedDocs = 0;
                
                // جمع جميع المستندات من جميع المستخدمين
                for (const [uid, user] of Object.entries(users)) {
                    if (user.userType !== 'user') continue;
                    
                    const imagesRef = ref(db, `users/${uid}/images`);
                    const imagesSnapshot = await get(imagesRef);
                    const images = imagesSnapshot.val() || {};
                    
                    // تصفح الأقسام المختلفة
                    for (const [section, sectionDocs] of Object.entries(images)) {
                        if (typeof sectionDocs === 'object' && sectionDocs !== null) {
                            for (const [docId, doc] of Object.entries(sectionDocs)) {
                                if (typeof doc === 'object' && doc !== null && doc.uploadedAt) {
                                    // جمع الصور من المستند
                                    const imageUrls = [];
                                    for (let key in doc) {
                                        if (!isNaN(key) && doc[key]) {
                                            imageUrls.push(doc[key]);
                                        }
                                    }
                                    
                                    // تحديث الإحصائيات
                                    totalDocs++;
                                    if (doc.status === 'pending') pendingDocs++;
                                    if (doc.status === 'approved') approvedDocs++;
                                    if (doc.status === 'rejected') rejectedDocs++;
                                    
                                    allDocuments.push({
                                        id: docId,
                                        userId: uid,
                                        userName: user.name || 'مستخدم مجهول',
                                        userInstitute: user.institute || 'غير محدد',
                                        title: doc.title || 'مستند بدون عنوان',
                                        section: section,
                                        uploadedAt: doc.uploadedAt,
                                        status: doc.status || 'pending',
                                        imageCount: imageUrls.length,
                                        thumbnail: imageUrls[0] || ''
                                    });
                                }
                            }
                        }
                    }
                }

                // تحديث الإحصائيات في الواجهة
                document.getElementById('totalDocuments').textContent = totalDocs;
                document.getElementById('pendingDocuments').textContent = pendingDocs;
                document.getElementById('approvedDocuments').textContent = approvedDocs;
                document.getElementById('rejectedDocuments').textContent = rejectedDocs;

                // ترتيب المستندات حسب تاريخ الرفع (الأحدث أولاً)
                allDocuments.sort((a, b) => b.uploadedAt - a.uploadedAt);
                
                // تعيين المستندات المفلترة
                filteredDocuments = [...allDocuments];
            } catch (error) {
                console.error('Error loading documents:', error);
                document.getElementById('documentsContainer').innerHTML = `
                    <div class="no-documents">
                        <i class="fas fa-exclamation-triangle"></i>
                        <h3>حدث خطأ في تحميل المستندات</h3>
                        <p>يرجى المحاولة مرة أخرى لاحقاً</p>
                    </div>
                `;
            }
        }

        // دالة الحصول على عنوان القسم
        function getSectionTitle(section) {
            const titles = {
                'hierarchy': 'الوثائق',
                'leadership-meetings': 'اجتماعات القيادة',
                'supervisor-meetings': 'اجتماعات المشرفين',
                'family-meetings': 'اجتماعات الأسر',
                'social-specialist': 'الأخصائي الاجتماعي',
                'librarian': 'أمين المكتبة',
                'sports': 'سجل التربية الرياضية',
                'general-photos': 'صور عامة ولوحات المعهد',
                'results': 'النتيجة',
                'attendance': 'الغياب',
                'domains': 'المجالات',
                'notes': 'الملاحظات',
                'training': 'وحدة التدريب',
                'committees': 'اللجان',
                'health-visitor': 'توثيق أنشطة الزائرة الصحية',
                'broadcast': 'الإذاعة',
                'curriculum-maps': 'خرائط المنهج',
                'teacher-record': 'سجل المعلم',
                'special-needs': 'سجل ذوي الاحتياجات الخاصة',
                'science-lab': 'معمل العلوم',
                'maintenance': 'سجل المتابعة والصيانة',
                'student-affairs': 'شؤون الطلبة',
                'institution-context': 'سياق المؤسسة',
                'staff-affairs': 'شؤون العاملين',
                'remedial-programs': 'البرامج العلاجية',
                'library': 'أمين المكتبة',
                'complaints': 'لجنة الشكاوي والمقترحات',
                'computer-lab': 'معمل الحاسب',
                'reward-committee': 'لجنة الأثابة والتقويم',
                'preparation-books':' دفاتر التحضير',
                'hope-peace-committee': 'لجنة الأمل والسلام'
            };
            return titles[section] || section;
        }

        // تحميل المستندات عند تحميل الصفحة
        document.addEventListener('DOMContentLoaded', () => {
            loadAllDocuments().then(() => {
                // تحميل أول دفعة من المستندات
                loadMoreDocuments();
            });
            
            // إضافة مستمع لحدث الكتابة في مربع البحث
            const searchInput = document.getElementById('searchInput');
            if (searchInput) {
                searchInput.addEventListener('input', function() {
                    if (this.value) {
                        document.getElementById('searchClear').classList.add('show');
                    } else {
                        document.getElementById('searchClear').classList.remove('show');
                    }
                });
            }
        });
        
        // إضافة مستمع لحدث التمرير
        window.addEventListener('scroll', checkScroll);
    </script>
</body>
