<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>محول الصوت الذكي | Whisper AI</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700&family=Cairo:wght@400;700&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --bg: #0b0f1a;
            --card-bg: rgba(22, 28, 45, 0.8);
            --text-main: #f8fafc;
            --text-dim: #94a3b8;
            --accent: #10b981;
            --danger: #ef4444;
            --progress-bg: rgba(255, 255, 255, 0.1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Cairo', 'Outfit', sans-serif;
        }

        body {
            background-color: var(--bg);
            background-image:
                radial-gradient(at 0% 0%, hsla(253, 16%, 10%, 1) 0, transparent 50%),
                radial-gradient(at 50% 0%, hsla(225, 39%, 20%, 1) 0, transparent 50%),
                radial-gradient(at 100% 0%, hsla(170, 100%, 10%, 1) 0, transparent 50%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-main);
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 650px;
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 32px;
            padding: 2.5rem;
            box-shadow: 0 50px 100px -20px rgba(0, 0, 0, 0.6);
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        /* Loading Overlay */
        #loadingOverlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: var(--bg);
            z-index: 100;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 2rem;
            transition: opacity 0.5s ease;
        }

        .loader {
            width: 48px;
            height: 48px;
            border: 5px solid #FFF;
            border-bottom-color: var(--primary);
            border-radius: 50%;
            display: inline-block;
            box-sizing: border-box;
            animation: rotation 1s linear infinite;
            margin-bottom: 2rem;
        }

        @keyframes rotation {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }

        .progress-container {
            width: 100%;
            max-width: 300px;
            height: 8px;
            background: var(--progress-bg);
            border-radius: 4px;
            margin-top: 1rem;
            overflow: hidden;
        }

        .progress-bar {
            width: 0%;
            height: 100%;
            background: var(--primary);
            transition: width 0.3s ease;
        }

        h1 {
            font-size: 2.2rem;
            margin-bottom: 0.5rem;
            background: linear-gradient(to right, #a5b4fc, #34d399);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .subtitle {
            color: var(--text-dim);
            margin-bottom: 2.5rem;
            font-size: 1rem;
        }

        .result-area {
            width: 100%;
            min-height: 250px;
            max-height: 400px;
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 20px;
            padding: 1.5rem;
            margin-bottom: 2rem;
            text-align: right;
            font-size: 1.25rem;
            line-height: 1.7;
            overflow-y: auto;
            color: var(--text-main);
            position: relative;
        }

        .result-area:empty::before {
            content: "اضغط على المايك وابدأ الكلام...";
            color: var(--text-dim);
            font-style: italic;
            opacity: 0.5;
        }

        .controls {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1.2rem;
        }

        .btn-record {
            width: 90px;
            height: 90px;
            border-radius: 50%;
            border: none;
            background: var(--primary);
            color: white;
            font-size: 1.8rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 10px 20px -5px rgba(99, 102, 241, 0.4);
        }

        .btn-record:hover:not(:disabled) {
            transform: scale(1.1);
            background: var(--primary-hover);
        }

        .btn-record.recording {
            background: var(--danger);
            animation: pulse-red 1.5s infinite;
        }

        @keyframes pulse-red {
            0% {
                box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7);
            }

            70% {
                box-shadow: 0 0 0 25px rgba(239, 68, 68, 0);
            }

            100% {
                box-shadow: 0 0 0 0 rgba(239, 68, 68, 0);
            }
        }

        .status-badge {
            padding: 0.4rem 1.2rem;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 20px;
            font-size: 0.85rem;
            color: var(--text-dim);
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .status-badge.active {
            color: var(--accent);
            background: rgba(16, 185, 129, 0.1);
        }

        .indicator {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: currentColor;
        }

        .action-btns {
            display: flex;
            gap: 1rem;
            margin-top: 1rem;
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: var(--text-main);
            padding: 0.6rem 1.8rem;
            border-radius: 12px;
            cursor: pointer;
            font-size: 0.9rem;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn-secondary:hover:not(:disabled) {
            background: rgba(255, 255, 255, 0.1);
            border-color: rgba(255, 255, 255, 0.2);
        }

        .btn-secondary:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }

        /* Transcription Animation */
        .dot-flashing {
            display: inline-block;
            position: relative;
            width: 10px;
            height: 10px;
            border-radius: 5px;
            background-color: var(--accent);
            color: var(--accent);
            animation: dot-flashing 1s infinite linear alternate;
            animation-delay: 0.5s;
            margin: 0 15px;
        }

        .dot-flashing::before,
        .dot-flashing::after {
            content: "";
            display: inline-block;
            position: absolute;
            top: 0;
        }

        .dot-flashing::before {
            left: -15px;
            width: 10px;
            height: 10px;
            border-radius: 5px;
            background-color: var(--accent);
            color: var(--accent);
            animation: dot-flashing 1s infinite alternate;
            animation-delay: 0s;
        }

        .dot-flashing::after {
            left: 15px;
            width: 10px;
            height: 10px;
            border-radius: 5px;
            background-color: var(--accent);
            color: var(--accent);
            animation: dot-flashing 1s infinite alternate;
            animation-delay: 1s;
        }

        @keyframes dot-flashing {
            0% {
                background-color: var(--accent);
            }

            50%,
            100% {
                background-color: rgba(16, 185, 129, 0.2);
            }
        }

        ::-webkit-scrollbar {
            width: 6px;
        }

        ::-webkit-scrollbar-track {
            background: transparent;
        }

        ::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
        }
    </style>
</head>

<body>

    <div class="container">
        <!-- Loader Screen -->
        <div id="loadingOverlay">
            <span class="loader"></span>
            <h2 id="loadingText">بيجهز الموديل.. ثواني يا بطل</h2>
            <p style="font-size: 0.8rem; color: var(--text-dim); margin-top: 0.5rem;">التحميل بيحصل أول مرة بس (حوالي 40
                ميجا)</p>
            <div class="progress-container">
                <div id="progressBar" class="progress-bar"></div>
            </div>
            <p id="progressPercent" style="margin-top: 8px; font-weight: bold; font-size: 0.9rem;">0%</p>
        </div>

        <h1>محول الصوت الذكي</h1>
        <p class="subtitle">تكنولوجيا Whisper AI لفهم العامية المصرية بدقة</p>

        <div id="output" class="result-area"></div>

        <div class="controls">
            <button id="recordBtn" class="btn-record" title="اضغط للتحدث">
                <svg id="micIcon" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                    stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path>
                    <path d="M19 10v2a7 7 0 0 1-14 0v-2"></path>
                    <line x1="12" y1="19" x2="12" y2="23"></line>
                    <line x1="8" y1="23" x2="16" y2="23"></line>
                </svg>
            </button>
            <div id="statusBadge" class="status-badge">
                <span class="indicator"></span>
                <span id="statusText">جاهز للعمل</span>
            </div>

            <div class="action-btns">
                <button id="clearBtn" class="btn-secondary">مسح الكل</button>
                <button id="copyBtn" class="btn-secondary">نسخ النص</button>
            </div>
        </div>
    </div>

    <!-- Script Section -->
    <script type="module">
        // Import Transformers.js
        import { pipeline, env } from 'https://cdn.jsdelivr.net/npm/@xenova/transformers@2.17.2';

        // UI Elements
        const loadingOverlay = document.getElementById('loadingOverlay');
        const progressBar = document.getElementById('progressBar');
        const progressPercent = document.getElementById('progressPercent');
        const output = document.getElementById('output');
        const recordBtn = document.getElementById('recordBtn');
        const statusText = document.getElementById('statusText');
        const statusBadge = document.getElementById('statusBadge');
        const copyBtn = document.getElementById('copyBtn');
        const clearBtn = document.getElementById('clearBtn');

        let transcriber;
        let mediaRecorder;
        let audioChunks = [];
        let isRecording = false;

        // 1. Initialize Whisper Pipeline
        async function initModel() {
            try {
                // Disable local models
                env.allowLocalModels = false;

                transcriber = await pipeline('automatic-speech-recognition', 'Xenova/whisper-tiny', {
                    progress_callback: (data) => {
                        if (data.status === 'progress') {
                            progressBar.style.width = `${data.progress}%`;
                            progressPercent.innerText = `${Math.round(data.progress)}%`;
                        } else if (data.status === 'done') {
                            // Model loaded
                        }
                    }
                });

                // Hide overlay after a small delay
                setTimeout(() => {
                    loadingOverlay.style.opacity = '0';
                    setTimeout(() => loadingOverlay.style.display = 'none', 500);
                }, 800);

            } catch (error) {
                console.error('Model loading failed:', error);
                document.getElementById('loadingText').innerText = 'فشل التحميل.. اتأكد إن النت شغال كويس';
                document.getElementById('loadingText').style.color = 'var(--danger)';
            }
        }

        initModel();

        // 2. Audio Recording Logic
        async function startRecording() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                mediaRecorder = new MediaRecorder(stream);
                audioChunks = [];

                mediaRecorder.ondataavailable = (event) => {
                    audioChunks.push(event.data);
                };

                mediaRecorder.onstop = processAudio;

                mediaRecorder.start();
                isRecording = true;
                recordBtn.classList.add('recording');
                statusText.innerText = 'بسجلك حالياً.. اتكلم براحتك';
                statusBadge.classList.add('active');
            } catch (err) {
                alert('لازم إذن المايك عشان نشتغل يا فنان');
            }
        }

        function stopRecording() {
            if (mediaRecorder && isRecording) {
                mediaRecorder.stop();
                isRecording = false;
                recordBtn.classList.remove('recording');
                statusText.innerText = 'ثواني وبترجم الكلام...';

                // Show thinking animation
                const loader = document.createElement('div');
                loader.className = 'dot-flashing';
                loader.id = 'thinking';
                output.appendChild(loader);
                output.scrollTop = output.scrollHeight;
            }
        }

        // 3. Audio Processing & Transcription
        async function processAudio() {
            const audioBlob = new Blob(audioChunks, { type: 'audio/wav' });
            const audioContext = new (window.AudioContext || window.webkitAudioContext)();
            const arrayBuffer = await audioBlob.arrayBuffer();
            const audioBuffer = await audioContext.decodeAudioData(arrayBuffer);

            // Whisper expects 16kHz mono audio
            const audioData = audioBuffer.getChannelData(0);

            try {
                const result = await transcriber(audioData, {
                    language: 'arabic',
                    task: 'transcribe',
                    return_timestamps: false
                });

                // Remove loader
                const loader = document.getElementById('thinking');
                if (loader) loader.remove();

                // Append text
                if (result.text.trim()) {
                    const textNode = document.createElement('p');
                    textNode.style.marginBottom = '10px';
                    textNode.innerText = result.text.trim();
                    output.appendChild(textNode);
                    output.scrollTop = output.scrollHeight;
                }

                statusText.innerText = 'جاهز للتسجيل تاني';
                statusBadge.classList.remove('active');

            } catch (err) {
                console.error('Transcription error:', err);
                statusText.innerText = 'حصل مشكلة في الترجمة، جرب تاني';
                const loader = document.getElementById('thinking');
                if (loader) loader.remove();
            }
        }

        // Event Listeners
        recordBtn.addEventListener('click', () => {
            if (isRecording) stopRecording();
            else startRecording();
        });

        copyBtn.addEventListener('click', () => {
            const text = output.innerText.trim();
            if (text) {
                navigator.clipboard.writeText(text).then(() => {
                    const original = copyBtn.innerText;
                    copyBtn.innerText = 'تم النسخ! ✅';
                    setTimeout(() => copyBtn.innerText = original, 2000);
                });
            }
        });

        clearBtn.addEventListener('click', () => {
            if (confirm('متأكد إنك عايز تمسح كل اللي كتبته؟')) {
                output.innerHTML = '';
            }
        });
    </script>
</body>

</html>
